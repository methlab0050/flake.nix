[general]
live_config_reload = true

[window]
dynamic_title = true
decorations_theme_variant = "Dark"

[font]
normal = { family = "CaskaydiaMono Nerd Font" }
offset = { x = -1, y = 1 }

[terminal]
shell = "fish"

[[hints.enabled]]
command = "xdg-open" # On Linux/BSD
hyperlinks = true
post_processing = true
persist = false
mouse = { mods = "Control", enabled = true }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"


[[hints.enabled]]
regex = "[a-zA-Z0-9_.~/-]+\\.[a-zA-Z0-9]{2,7}"
command = { program = "nautilus" }
# post_processing = true
mouse = { mods = "Control", enabled = true }

[colors.primary]
background = "#191323"
foreground = "#cccccc"

[colors.cursor]
cursor = "#e07d13"
text = "#ffffff"

[colors.selection]
background = "#220525"
text = "#f4f4f4"

[colors.normal]
black   = "#17141f"
red     = "#ff6b7f"
green   = "#00bd9c"
yellow  = "#e6c62f"
blue    = "#22e8df"
magenta = "#dc396a"
cyan    = "#56b6c2"
white   = "#f1f1f1"

[colors.bright]
black   = "#495162"
red     = "#fe9ea1"
green   = "#98c379"
yellow  = "#f9e46b"
blue    = "#91fff4"
magenta = "#da70d6"
cyan    = "#bcf3ff"
white   = "#ffffff"
